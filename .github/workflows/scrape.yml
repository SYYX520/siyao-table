name: Auto Scrape Tencent Docs

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install

      - name: Install Chromium
        run: npx puppeteer browsers install chrome

      - name: Find Chrome
        run: |
          CHROME_PATH=$(find /home/runner/.cache/puppeteer -name "chrome" -type f | head -1)
          echo "Chrome found at: $CHROME_PATH"
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> $GITHUB_ENV

      - name: Scrape Tencent Docs
        run: node puppeteer-scraper.js

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add siyao_data.js
          git diff --cached --quiet || git commit -m "Auto-update from Tencent Docs [skip ci]"
          git push
