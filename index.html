/* ===== Reset & Base ===== */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','PingFang SC',-apple-system,BlinkMacSystemFont,sans-serif;font-size:13px;color:#595959;background:#f0f2f5}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#bbb;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#999}
::-webkit-scrollbar-track{background:#f0f0f0}

/* ===== Layout ===== */
.header{background:linear-gradient(135deg,#FFD700 0%,#FFA500 100%);color:#4a3500;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.qrcode-banner{text-align:center;padding:10px 8px 6px;background:#fff;border-bottom:1px solid #f0f0f0}
.qrcode-banner img{max-width:420px;width:100%;height:auto;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);display:block;margin:0 auto 6px;image-rendering:pixelated;cursor:zoom-in}
.qrcode-banner p{margin:0;font-size:17px;font-weight:700;color:#333}
.qr-overlay{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.8);z-index:9999;justify-content:center;align-items:center;cursor:zoom-out}
.qr-overlay img{max-width:95vw;max-height:95vh;width:auto;height:auto;border-radius:8px;image-rendering:pixelated}
.header h1{font-size:18px;font-weight:600;white-space:nowrap}
.header-right{display:flex;align-items:center;gap:12px}
.bj-clock{background:rgba(255,255,255,.5);padding:4px 12px;border-radius:6px;font-size:13px;font-family:'Consolas','Monaco',monospace;white-space:nowrap}
.refresh-btn{background:rgba(74,53,0,.15);border:1px solid rgba(74,53,0,.35);color:#4a3500;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap;transition:background .2s}
.refresh-btn:hover{background:rgba(74,53,0,.25)}
.refresh-btn:disabled{opacity:.6;cursor:not-allowed}

/* ===== Filter Bar ===== */
.filter-bar{background:#fff;padding:10px 16px;border-bottom:1px solid #e8e8e8;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;position:sticky;top:46px;z-index:90}
.filter-group{display:flex;align-items:center;gap:4px}
.filter-label{font-size:12px;color:#8c8c8c;white-space:nowrap}
.filter-bar select,.filter-bar input[type="number"]{height:28px;border:1px solid #d9d9d9;border-radius:4px;padding:0 6px;font-size:12px;color:#595959;background:#fff;outline:none}
.filter-bar select{min-width:80px;cursor:pointer}
.filter-bar select:hover,.filter-bar input:hover{border-color:#409eff}
.filter-bar select:focus,.filter-bar input:focus{border-color:#409eff;box-shadow:0 0 0 2px rgba(24,144,255,.1)}
.filter-bar input[type="number"]{width:60px}
.range-sep{color:#bfbfbf;font-size:12px}
.search-box{flex:1;min-width:140px;height:28px;border:1px solid #d9d9d9;border-radius:4px;padding:0 10px;font-size:12px;outline:none}
.search-box:focus{border-color:#409eff;box-shadow:0 0 0 2px rgba(24,144,255,.1)}
.skin-select{min-width:120px}

/* ===== Stats Bar ===== */
.stats-bar{background:#fff;padding:8px 16px;border-bottom:1px solid #e8e8e8;display:flex;gap:20px;align-items:center;font-size:12px;color:#8c8c8c}
.stats-bar .stat-item{display:flex;align-items:center;gap:4px}
.stats-bar .stat-value{font-weight:600;color:#262626;font-size:14px}
.stats-bar .stat-value.on-sale{color:#52c41a}
.stats-bar .stat-value.sold{color:#ff4d4f}
.status-msg{flex:1;font-size:12px;color:#8c8c8c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== Table ===== */
.table-wrap{overflow-x:auto;overflow-y:auto;max-height:calc(100vh - 180px);position:relative}
table{border-collapse:collapse;width:max-content;min-width:100%;font-size:12px}
thead th{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#FFF4D6,#FFE4B5);border-bottom:2px solid #E8C547;border-right:1px solid #f0e6c0;padding:8px 6px;text-align:center;font-weight:600;color:#4a3500;white-space:nowrap;font-size:12px}
thead th.fixed-left{position:sticky;left:0;z-index:15}
thead th.fixed-right{position:sticky;right:0;z-index:15}
thead th.col-sort{cursor:pointer;user-select:none}
thead th.col-sort:hover{background:#f0f0f0}
thead th.col-sort::after{content:' ⇅';font-size:10px;color:#bbb}
thead th.col-sort.sort-asc::after{content:' ↑';color:#1890ff;font-size:12px}
thead th.col-sort.sort-desc::after{content:' ↓';color:#1890ff;font-size:12px}
tbody td{border-bottom:1px solid #f0f0f0;border-right:1px solid #f5f5f5;padding:6px;text-align:center;white-space:nowrap;line-height:1.4}
tbody td.fixed-left{position:sticky;left:0;z-index:5;background:#fff}
tbody td.fixed-right{position:sticky;right:0;z-index:5;background:#fff}
tbody tr:hover td{background:#f5f9ff}
tbody tr:hover td.fixed-left{background:#f5f9ff}
tbody tr:hover td.fixed-right{background:#f5f9ff}
tbody tr.sold-row td{opacity:.5}
tbody tr.sold-row td.fixed-left{opacity:.5}

/* col backgrounds */
.col-green-bg{background:#f6ffed!important}
tbody tr:hover .col-green-bg{background:#eefbe2!important}

/* ===== Cell Styles ===== */
.wid-cell{cursor:pointer;line-height:1.4;text-align:center}
.wid-cell .wid-text{font-weight:600;font-size:13px;color:#262626}
.wid-cell .wid-copy{font-size:11px;color:#8c8c8c}
.wid-cell:hover .wid-text{color:#1890ff}
.special-badge{display:inline-block;background:linear-gradient(135deg,#FFAA44,#FF7744);color:#fff;font-size:9px;padding:1px 4px;border-radius:3px;margin-right:3px;vertical-align:middle}

/* Rank tags */
.rank-tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:11px;font-weight:600}
.rank-0{background:#f5f5f5;color:#8c8c8c}
.rank-1{background:#e8d5b0;color:#8b6914}
.rank-2{background:#e0e0e0;color:#666}
.rank-3{background:#fff3cd;color:#856404}
.rank-4{background:#e6e6fa;color:#5b5b9f}
.rank-5{background:#d4edda;color:#155724}
.rank-6{background:#d1ecf1;color:#0c5460}
.rank-7{background:#f8d7da;color:#721c24}

/* Ratio pills */
.ratio-pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.ratio-50{background:#fff1f0;color:#ff4d4f;border:1px solid #ffa39e}
.ratio-45{background:#fff7e6;color:#fa8c16;border:1px solid #ffd591}
.ratio-40{background:#fffbe6;color:#d4b106;border:1px solid #ffe58f}
.ratio-35{background:#f6ffed;color:#52c41a;border:1px solid #b7eb8f}
.ratio-30{background:#e6f7ff;color:#1890ff;border:1px solid #91d5ff}
.ratio-default{background:#f5f5f5;color:#8c8c8c;border:1px solid #d9d9d9}

/* Pills (stamina, weight) */
.pill{display:inline-block;padding:1px 6px;border-radius:3px;font-size:11px}
.pill-high{background:#e6f7ff;color:#1890ff;border:1px solid #91d5ff;font-weight:600}
.pill-default{background:#f5f5f5;color:#8c8c8c;border:1px solid #d9d9d9}

/* Safe box tags */
.safe-box-tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:11px;font-weight:600}
.safe-4{background:#f5f5f5;color:#8c8c8c}
.safe-6{background:#e6f7ff;color:#1890ff}
.safe-9{background:#f6ffed;color:#52c41a}

/* Login badges */
.login-qq{background:#e6f7ff;color:#1890ff;padding:1px 6px;border-radius:3px;font-size:11px}
.login-wx{background:#f6ffed;color:#52c41a;padding:1px 6px;border-radius:3px;font-size:11px}
.login-unknown{background:#f5f5f5;color:#8c8c8c;padding:1px 6px;border-radius:3px;font-size:11px}

/* Price cells */
.price-cell{font-weight:600;color:#262626}
.price-total{color:#52c41a;font-weight:700}

/* Skin cells */
.skin-knife{color:#fa8c16;font-weight:600;font-size:11px;line-height:1.5}
.skin-red{color:#ff4d4f;font-weight:600;font-size:11px;line-height:1.5}
.skin-gold{color:#13c2c2;font-weight:600;font-size:11px;line-height:1.5}

/* Remark */
.remark-cell{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:help}
.remark-cell:hover{color:#1890ff}

/* Time range */
.time-range{font-size:11px;color:#595959}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 20px;border-radius:6px;font-size:13px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* Progress */
.progress-bar{position:fixed;top:46px;left:0;right:0;height:3px;background:transparent;z-index:95}
.progress-bar .bar{height:100%;background:#1890ff;width:0;transition:width .3s}

/* Empty state */
.empty-state{text-align:center;padding:60px 20px;color:#8c8c8c;font-size:14px}
.empty-state .icon{font-size:48px;margin-bottom:10px}

/* ===== Floating Scrollbar ===== */
.float-scroll{position:fixed;bottom:0;left:0;right:0;height:16px;background:#e8e8e8;border-top:1px solid #d0d0d0;z-index:88;display:none}
.float-track{position:relative;height:100%;overflow:hidden}
.float-thumb{position:absolute;top:1px;left:0;height:14px;background:#1890ff;border-radius:7px;cursor:grab;min-width:30px;opacity:.8;transition:opacity .2s}
.float-thumb:hover{opacity:1}
.float-thumb:active{cursor:grabbing;opacity:1}

/* ===== Responsive ===== */
@media(max-width:768px){
  .header h1{font-size:14px}
  .header-right{gap:6px}
  .bj-clock{font-size:11px;padding:3px 8px}
  .refresh-btn{padding:4px 10px;font-size:11px}
  .filter-bar{top:42px;padding:8px 10px;gap:6px 8px}
  .filter-label{font-size:11px}
  .filter-bar select{min-width:70px;font-size:11px}
  .search-box{min-width:100px;font-size:11px}
  .skin-select{min-width:100px}
  .stats-bar{padding:6px 10px;gap:12px;font-size:11px}
  .stats-bar .stat-value{font-size:12px}
  .table-wrap{max-height:calc(100vh - 220px)}
  thead th{padding:6px 4px;font-size:11px}
  tbody td{padding:4px 3px;font-size:11px}
}
</style>

/* ===== Helpers ===== */
function esc(s){return String(s==null?'':s).replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function skinName(id){return SKIN_MAP[id]||('ID:'+id)}
function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(function(){el.classList.remove('show')},2500)}
function ratioClass(r){
  if(r>=50)return 'ratio-50';
  if(r>=45)return 'ratio-45';
  if(r>=40)return 'ratio-40';
  if(r>=35)return 'ratio-35';
  if(r>=30)return 'ratio-30';
  return 'ratio-default';
}
function formatTimeRange(r){
  if(!r||r==='-')return '-';
  var m=r.match(/(\d+)点-(\d+)点/);
  if(m)return m[1]+':00-'+m[2]+':00';
  return r;
}
function getProvince(region){
  if(!region)return '-';
  return region.split(/[- ]/)[0];
}
function copyText(text){
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){toast('已复制: '+text)}).catch(function(){fallbackCopy(text)});
  }else{fallbackCopy(text)}
}
function fallbackCopy(text){
  var ta=document.createElement('textarea');
  ta.value=text;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('已复制: '+text)}catch(e){toast('复制失败')}
  document.body.removeChild(ta);
}

/* ===== Skin formatters ===== */
function formatKnifeSkin(r){
  var names=r.knife_skin_names||[];
  if(!names.length)return '<span style="color:#bfbfbf">-</span>';
  var full=names.join(', ');
  return '<span class="skin-knife" title="'+esc(full)+'">'+esc(names[0])+(names.length>1?' +' +(names.length-1):'')+'</span>';
}
function formatOperatorSkin(r){
  var red=r.red_skin_names||[];
  var gold=r.gold_skin_names||[];
  var weapon=r.weapon_skin_names||[];
  var total=red.length+gold.length+weapon.length;
  if(total===0)return '<span style="color:#bfbfbf">-</span>';
  var parts=[];
  if(red.length){parts.push('<span class="skin-red">'+red.map(function(n){return esc(n)}).join('<br>')+'</span>')}
  if(gold.length){parts.push('<span class="skin-gold">'+gold.map(function(n){return esc(n)}).join('<br>')+'</span>')}
  if(weapon.length){parts.push('<span style="color:#1890ff;font-size:11px">'+weapon.map(function(n){return esc(n)}).join('<br>')+'</span>')}
  return '<div style="line-height:1.5">'+parts.join('<br>')+'</div>';
}

    return false;
  });
  if(stf)data=data.filter(function(r){return String(r.stamina||0)===stf});
  if(wf)data=data.filter(function(r){return String(r.weight_capacity||0)===wf});
  if(lf)data=data.filter(function(r){return r.login_type===lf});
  if(kf==='has')data=data.filter(function(r){return (r.knife_skin_names||[]).length>0});
  else if(kf==='none')data=data.filter(function(r){return (r.knife_skin_names||[]).length===0});
  else if(kf&&kf.indexOf('k_')===0){var kid=kf.substring(2);data=data.filter(function(r){return (r.knife_skin||[]).some(function(x){return String(x)===kid})})}
  if(cf==='has_char')data=data.filter(function(r){return (r.gold_skin_names||[]).length>0||(r.red_skin_names||[]).length>0});
  else if(cf==='has_weapon')data=data.filter(function(r){return (r.weapon_skin_names||[]).length>0});
  else if(cf==='has_any')data=data.filter(function(r){return (r.gold_skin_names||[]).length>0||(r.red_skin_names||[]).length>0||(r.weapon_skin_names||[]).length>0});
  else if(cf==='no_skin')data=data.filter(function(r){return (r.gold_skin_names||[]).length===0&&(r.red_skin_names||[]).length===0&&(r.weapon_skin_names||[]).length===0});
  else if(cf&&cf.indexOf('g_')===0){var gid=cf.substring(2);data=data.filter(function(r){return (r.gold_skin||[]).some(function(x){return String(x)===gid})})}
  else if(cf&&cf.indexOf('r_')===0){var rid=cf.substring(2);data=data.filter(function(r){return (r.red_skin||[]).some(function(x){return String(x)===rid})})}
  else if(cf&&cf.indexOf('w_')===0){var wid=cf.substring(2);data=data.filter(function(r){return (r.weapon_skin||[]).some(function(x){return String(x)===wid})})}
  if(search){
    data=data.filter(function(r){
      var s=JSON.stringify(r).toLowerCase();
      return s.indexOf(search)>=0;
    });
  }

  /* Sort */
  if(sortV){
    var parts=sortV.split('_');
    var field=parts[0],dir=parts[1];
    var mult=dir==='desc'?-1:1;
    data.sort(function(a,b){
      var av,bv;
      if(field==='ratio'){av=a.ratio||0;bv=b.ratio||0}
      else if(field==='huff'){av=a.huff||0;bv=b.huff||0}
      else if(field==='price'){av=a.sale_price||0;bv=b.sale_price||0}
      else if(field==='total'){av=a.total_price||0;bv=b.total_price||0}
      else if(field==='kd'){av=a.kd||0;bv=b.kd||0}
      else if(field==='rank'){av=RANK_ORDER[a.rank]||0;bv=RANK_ORDER[b.rank]||0}
      else if(field==='rent'){av=a.rent_days||0;bv=b.rent_days||0}
      else if(field==='awm'){av=a.awm||0;bv=b.awm||0}
      else if(field==='helmet'){av=a.helmet||0;bv=b.helmet||0}
      else if(field==='armor'){av=a.armor||0;bv=b.armor||0}
      else if(field==='sale_price'){av=a.sale_price||0;bv=b.sale_price||0}
      else if(field==='equi_rent'){av=a.equi_rent||0;bv=b.equi_rent||0}
      else if(field==='total_price'){av=a.total_price||0;bv=b.total_price||0}
      else{av=0;bv=0}
      return (av-bv)*mult;
    });
  }else{
    data.sort(function(a,b){
      if(a.status!==b.status)return a.status==='在售'?-1:1;
      return (b.ratio||0)-(a.ratio||0);
    });
  }

  /* Render rows */
  if(!data.length){
    body.innerHTML='<tr><td colspan="23" class="empty-state"><div class="icon">📭</div>暂无数据</td></tr>';
  }else{
    body.innerHTML=data.map(function(r){
      var isSold=r.status==='已售下架';
      var rankVal=r.rank_val!=null?r.rank_val:0;
      var loginHtml;
      var lt=r.login_type||'';
      if(lt.indexOf('QQ')>=0)loginHtml='<span class="login-qq">'+esc(lt)+'</span>';
      else if(lt.indexOf('微信')>=0)loginHtml='<span class="login-wx">'+esc(lt)+'</span>';
      else loginHtml='<span class="login-unknown">'+esc(lt||'未知')+'</span>';

      var specialBadge=r.is_special===1?'<span class="special-badge">特价</span>':'';
      var widText=r.wid||r.sale_user||'-';
      var kfVal=r.kf||'';
      var copyVal=kfVal?kfVal+'-'+widText:widText;

      return '<tr class="'+(isSold?'sold-row':'')+'">'+
        '<td class="fixed-left"><div class="wid-cell" onclick="copyText(\''+esc(copyVal)+'\')">'+
          specialBadge+'<div class="wid-text">'+esc(widText)+'</div>'+
          '<div class="wid-copy">📋 点击复制</div></div></td>'+
        '<td>'+esc(getProvince(r.login_region))+'</td>'+
        '<td>'+loginHtml+'</td>'+
        '<td><span class="rank-tag rank-'+rankVal+'">'+esc(r.rank||'无段位')+'</span></td>'+
        '<td>'+(r.huff||0)+'</td>'+
        '<td><span class="ratio-pill '+ratioClass(r.ratio||0)+'">'+(r.ratio||0)+'</span></td>'+
        '<td>'+(r.level||'-')+'</td>'+
        '<td><span class="pill '+(r.stamina>=7?'pill-high':'pill-default')+'">'+(r.stamina||0)+'级</span></td>'+
        '<td><span class="pill '+(r.weight_capacity>=7?'pill-high':'pill-default')+'">'+(r.weight_capacity||0)+'级</span></td>'+
        '<td><span class="safe-box-tag safe-'+(r.safe_box&&r.safe_box.indexOf('3*3')>=0?'9':r.safe_box&&r.safe_box.indexOf('2*3')>=0?'6':r.safe_box&&r.safe_box.indexOf('2*2')>=0?'4':'0')+'">'+esc(r.safe_box||'-')+'</span></td>'+
        '<td>'+(r.red_bullet>0?r.red_bullet:'<span style="color:#bfbfbf">-</span>')+'</td>'+
        '<td>'+(r.awm>0?r.awm:'<span style="color:#bfbfbf">-</span>')+'</td>'+
        '<td>'+(r.helmet>0?r.helmet:'<span style="color:#bfbfbf">-</span>')+'</td>'+
        '<td>'+(r.armor>0?r.armor:'<span style="color:#bfbfbf">-</span>')+'</td>'+
        '<td>'+formatKnifeSkin(r)+'</td>'+
        '<td>'+formatOperatorSkin(r)+'</td>'+
        '<td><div class="remark-cell" title="'+esc(r.remark||'')+'">'+esc(r.remark||'-')+'</div></td>'+
        '<td class="fixed-right price-cell">'+(r.sale_price!=null?'¥'+r.sale_price.toFixed(2):'-')+'</td>'+
        '<td class="fixed-right col-green-bg price-total">¥'+(r.total_price||0).toFixed(2)+'</td>'+
      '</tr>';
    }).join('');
  }

  /* Stats */
  var onSale=rentalData.filter(function(r){return r.status==='在售'}).length;
  var sold=rentalData.filter(function(r){return r.status==='已售下架'}).length;
  var maxRatio=data.length?Math.max.apply(null,data.filter(function(r){return r.status==='在售'}).map(function(r){return r.ratio||0})):'-';
  document.getElementById('statOnSale').textContent=onSale;
  document.getElementById('statSold').textContent=sold;
  document.getElementById('statMaxRatio').textContent=maxRatio||'-';

  /* Sort indicators */
  document.querySelectorAll('th.col-sort').forEach(function(th){
    th.classList.remove('sort-asc','sort-desc');
    var s=th.dataset.sort;
    if(sortV){
      var sp=sortV.split('_');
      if(sp[0]===s){
        th.classList.add(sp[1]==='desc'?'sort-desc':'sort-asc');
      }
    }
  });

  /* Float scroll */
  syncFloatScroll();
}

/* ===== Live Scrape ===== */
async function liveScrape(silent){
  if(_scraping){if(!silent)toast('正在抓取中，请稍候...');return}
  _scraping=true;
  var btn=document.getElementById('refreshBtn');
  var prog=document.getElementById('progressBar');
  var progFill=document.getElementById('progressBarFill');
  var status=document.getElementById('statusMsg');
  if(btn){btn.disabled=true;btn.textContent='⏳ 抓取中...'}
  if(prog){prog.style.display='block';progFill.style.width='10%'}

  /* Try local server first */
  try{
    if(!silent&&status)status.textContent='正在刷新数据... 20%';
    if(progFill)progFill.style.width='20%';
    var resp=await fetch('/api/refresh',{method:'POST',headers:{'Content-Type':'application/json'}});
    if(resp.ok){
      var result=await resp.json();
      if(result.code===200){
        rentalData=result.data||[];
        DB.set('rental',rentalData);
        DB.set('rental_last_refresh',result.timestamp);
        renderTable();
        if(status)status.innerHTML='✅ '+result.timestamp+' | 在售'+result.stats.on_sale+'条'+(result.stats.sold?'，已售'+result.stats.sold+'条':'');
        if(!silent)toast('已更新 '+result.stats.on_sale+' 条在售数据');
        updateLastRefresh(result.timestamp);
        if(btn){btn.disabled=false;btn.textContent='🔄 刷新数据'}
        if(prog){progFill.style.width='100%';setTimeout(function(){prog.style.display='none'},800)}
        _scraping=false;
        return;
      }
    }
    throw new Error('Server returned '+resp.status);
  }catch(e){
    console.log('Local server unavailable, trying remote...');
  }

  /* Try CORS proxy */
  try{
    if(!silent&&status)status.textContent='正在刷新数据... 30%';
    if(progFill)progFill.style.width='30%';
    var remoteResult=await liveScrapeRemote(silent,status,progFill);
    if(btn){btn.disabled=false;btn.textContent='🔄 刷新数据'}
    if(prog){progFill.style.width='100%';setTimeout(function(){prog.style.display='none'},800)}
    _scraping=false;
    return;
  }catch(e){
    console.log('Remote scrape failed:',e.message);
  }

  /* Fallback to static data */
  if(typeof window.SCRAPED_RENTAL_DATA!=='undefined'&&window.SCRAPED_RENTAL_DATA.length){
    rentalData=window.SCRAPED_RENTAL_DATA;
    renderTable();
    var onSale=rentalData.filter(function(r){return r.status==='在售'}).length;
    if(status)status.textContent='已加载静态数据 '+rentalData.length+' 条（在售'+onSale+'）';
    if(!silent)toast('已加载 '+rentalData.length+' 条数据');
  }else{
    if(status)status.textContent='❌ 抓取失败，请确保服务器运行或检查网络';
    if(!silent)toast('抓取失败');
  }
  if(btn){btn.disabled=false;btn.textContent='🔄 刷新数据'}
  if(prog){prog.style.display='none'}
  _scraping=false;
}

async function _fetchViaProxy(proxyIdx,apiUrl,postBody){
  var errors=[];
  for(var i=proxyIdx;i<CORS_PROXIES.length;i++){
    try{
      var proxyUrl=CORS_PROXIES[i](apiUrl);
      var opts={method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(postBody)};
      var resp=await fetch(proxyUrl,opts);
      if(!resp.ok){errors.push('proxy'+i+':HTTP'+resp.status);continue}
      var data=await resp.json();
      return data;
    }catch(e){errors.push('proxy'+i+':'+e.message)}
  }
  throw new Error(errors.join('; '));
}

function _parseSkinFe(skinVal){
  if(!skinVal||skinVal==='None'||skinVal===null)return [];
  if(Array.isArray(skinVal))return skinVal;
  if(typeof skinVal==='string')return skinVal.split(',').map(function(s){return s.trim()}).filter(Boolean);
  return [];
}
function _skinNamesFe(ids){return ids.map(function(id){return SKIN_MAP[id]||('ID:'+id)})}
function _parseEquiFe(equiJsonStr){
  var result={helmet:0,armor:0,awm:0,red_bullet:0};
  if(!equiJsonStr)return result;
  try{
    var data=typeof equiJsonStr==='string'?JSON.parse(equiJsonStr):equiJsonStr;
    for(var k in data){
      if(k==='-999')continue;
      var name=data[k].name||'';
      var count=data[k].count||0;
      if(name.indexOf('6级头')>=0)result.helmet=count;
      else if(name.indexOf('6级甲')>=0)result.armor=count;
      else if(name.indexOf('AWM')>=0||name.indexOf('awm')>=0)result.awm=count;
      else if(name.indexOf('红弹')>=0||name.indexOf('红色子弹')>=0)result.red_bullet=count;
    }
  }catch(e){}
  return result;
}

function _formatAccountFe(acc,sourceName,domain){
  var equi=_parseEquiFe(acc.game_buy_equi_json);
  var timeRange='';
  if(acc.game_time_range_start!=null&&acc.game_time_range_end!=null){
    timeRange=acc.game_time_range_start+'点-'+acc.game_time_range_end+'点';
  }
  var rankVal=acc.game_rank||0;
  var rankText=RANK_MAP[rankVal]||'无段位';
  var loginVal=acc.login_type||0;
  var loginText=LOGIN_MAP[loginVal]||'未知';
  var safeBoxVal=acc.game_safe_box||0;
  var safeBoxText=SAFE_BOX_MAP[safeBoxVal]||String(safeBoxVal);
  var salePrice=acc.game_sale_price||0;
  var deposit=acc.game_sale_deposit||0;
  var equiRent=acc.game_sale_equi_rental_fee||0;
  var total=Math.round((salePrice+equiRent)*100)/100;
  var knifeIds=_parseSkinFe(acc.game_special_knife_skin);
  var weaponIds=_parseSkinFe(acc.game_weapon_skin);
  var goldIds=_parseSkinFe(acc.game_character_gold_skin);
  var redIds=_parseSkinFe(acc.game_character_red_skin);
  var nowStr=new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});
  return {
    wid:acc.sale_user||'',kf:acc.kf||'',source:sourceName,domain:domain,status:'在售',
    ratio:acc.game_sale_ratio||0,huff:acc.game_huff||0,
    rank:rankText,rank_val:rankVal,level:acc.game_level||0,kd:acc.game_kd||0,
    rent_days:acc.game_rent_days||0,time_range:timeRange,login_type:loginText,
    login_region:acc.login_region||'',safe_box:safeBoxText,
    stamina:acc.game_stamina||0,weight_capacity:acc.game_weight_capacity||0,
    sale_price:salePrice,deposit:deposit,equi_rent:equiRent,total_price:total,
    helmet:equi.helmet,armor:equi.armor,awm:equi.awm,red_bullet:equi.red_bullet,
    knife_skin:knifeIds,weapon_skin:weaponIds,gold_skin:goldIds,red_skin:redIds,
    knife_skin_names:_skinNamesFe(knifeIds),weapon_skin_names:_skinNamesFe(weaponIds),
    gold_skin_names:_skinNamesFe(goldIds),red_skin_names:_skinNamesFe(redIds),
    remark:acc.remark||'',is_special:acc.is_special_price||0,is_exp_card:acc.game_exp_card||0,
    last_seen:nowStr,first_seen:nowStr
  };
}

async function liveScrapeRemote(silent,statusEl,progFill){
  var allAccounts=[];
  var sourceResults=[];
  var totalSources=REMOTE_SOURCES.length;
  var FILTER_CONDITIONS=[
    {label:'6格7体7负',game_safe_box:6,game_stamina:7,game_weight_capacity:7},
    {label:'9格7体6负',game_safe_box:9,game_stamina:7,game_weight_capacity:6},
    {label:'9格7体7负',game_safe_box:9,game_stamina:7,game_weight_capacity:7}
  ];
  var totalSteps=totalSources*FILTER_CONDITIONS.length;
  var stepIdx=0;
  for(var si=0;si<totalSources;si++){
    var src=REMOTE_SOURCES[si];
    var sourceAccounts=[];
    var sourceOk=false;
    for(var ci=0;ci<FILTER_CONDITIONS.length;ci++){
      var cond=FILTER_CONDITIONS[ci];
      stepIdx++;
      var pct=Math.round(stepIdx/totalSteps*100);
      if(statusEl)statusEl.textContent='正在刷新数据... '+pct+'%';
      if(progFill)progFill.style.width=(30+Math.round(stepIdx/totalSteps*60))+'%';
      var page=1;
      var condAccounts=[];
      var proxyIdx=0;
      try{
        while(page<=50){
          var postBody={page:page,size:100,game_safe_box:cond.game_safe_box,game_stamina:cond.game_stamina,game_weight_capacity:cond.game_weight_capacity,sort_field:'game_sale_ratio',sort_order:'desc'};
          var apiUrl='https://'+src.domain+'/api/game/account/list';
          var data=await _fetchViaProxy(proxyIdx,apiUrl,postBody);
          var items=data.data&&data.data.result?data.data.result:(data.data&&data.data.list?data.data.list:[]);
          if(!items||!items.length)break;
          for(var j=0;j<items.length;j++){
            condAccounts.push(_formatAccountFe(items[j],src.name,src.domain));
          }
          var totalPages=data.data&&data.data.totalPages?data.data.totalPages:1;
          if(page>=totalPages)break;
          page++;
        }
        sourceAccounts=sourceAccounts.concat(condAccounts);
        sourceOk=true;
      }catch(e){
        /* condition failed, try next */
      }
    }
    var seen={};
    var unique=sourceAccounts.filter(function(a){if(seen[a.wid])return false;seen[a.wid]=true;return true});
    unique.sort(function(a,b){return (b.ratio||0)-(a.ratio||0)});
    allAccounts=allAccounts.concat(unique);
    sourceResults.push({name:src.name,status:sourceOk?'ok':'error',count:unique.length,error:sourceOk?'':'抓取失败'});
  }
  if(!allAccounts.length)throw new Error('所有网站抓取失败');

  rentalData=allAccounts;
  DB.set('rental',rentalData);
  var nowStr=new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});
  DB.set('rental_last_refresh',nowStr);

  var onSale=rentalData.filter(function(r){return r.status==='在售'}).length;

  if(statusEl)statusEl.innerHTML='✅ '+nowStr+' | 在售'+onSale+'条';
  renderTable();
  updateLastRefresh(nowStr);
  if(!silent)toast('已抓取 '+onSale+' 条在售数据');
  return true;
}

/* ===== Beijing Clock ===== */
function initBeijingClock(){
  var el=document.getElementById('bjClock');
  if(!el)return;
  function pad(n){return n<10?'0'+n:''+n}
  function tick(){
    var now=new Date();
    var utcMs=now.getTime()+now.getTimezoneOffset()*60000;
    var bj=new Date(utcMs+8*3600000);
    var y=bj.getFullYear();
    var mo=pad(bj.getMonth()+1);
    var d=pad(bj.getDate());
    var h=pad(bj.getHours());
    var mi=pad(bj.getMinutes());
    var s=pad(bj.getSeconds());
    var week=['日','一','二','三','四','五','六'][bj.getDay()];
    el.textContent=y+'-'+mo+'-'+d+' '+h+':'+mi+':'+s+' 周'+week;
  }
  tick();
  setInterval(tick,1000);
}

/* ===== Floating Scrollbar ===== */
var _floatScroll=document.getElementById('floatScroll');
var _floatTrack=document.getElementById('floatTrack');
var _floatThumb=document.getElementById('floatThumb');
var _tableWrap=document.getElementById('tableWrap');
var _isDragging=false;

function syncFloatScroll(){
  var table=document.getElementById('rentalTable');
  if(!table||!_tableWrap)return;
  var sw=table.scrollWidth;
  var cw=_tableWrap.clientWidth;
  if(sw>cw+5){
    _floatScroll.style.display='block';
    var ratio=cw/sw;
    var thumbW=Math.max(30,cw*ratio);
    _floatThumb.style.width=thumbW+'px';
    var maxScroll=sw-cw;
    var scrollRatio=_tableWrap.scrollLeft/maxScroll;
    var thumbMax=cw-thumbW;
    _floatThumb.style.left=(thumbMax*scrollRatio)+'px';
  }else{
    _floatScroll.style.display='none';
  }
}

_floatThumb.addEventListener('mousedown',startDrag);
_floatThumb.addEventListener('touchstart',startDrag,{passive:false});
var _dragStartX=0;
var _dragStartThumbLeft=0;
function startDrag(e){
  e.preventDefault();
  _isDragging=true;
  var x=e.touches?e.touches[0].clientX:e.clientX;
  _dragStartX=x;
  _dragStartThumbLeft=parseFloat(_floatThumb.style.left)||0;
  document.addEventListener('mousemove',onDrag);
  document.addEventListener('mouseup',endDrag);
  document.addEventListener('touchmove',onDrag,{passive:false});
  document.addEventListener('touchend',endDrag);
}
function onDrag(e){
  if(!_isDragging)return;
  e.preventDefault();
  var x=e.touches?e.touches[0].clientX:e.clientX;
  var deltaX=x-_dragStartX;
  var table=document.getElementById('rentalTable');
  var sw=table.scrollWidth;
  var cw=_tableWrap.clientWidth;
  var thumbW=parseFloat(_floatThumb.style.width)||30;
  var thumbMax=cw-thumbW;
  var newThumbLeft=Math.max(0,Math.min(thumbMax,_dragStartThumbLeft+deltaX));
  var scrollRatio=thumbMax>0?newThumbLeft/thumbMax:0;
  _tableWrap.scrollLeft=(sw-cw)*scrollRatio;
}
function endDrag(){
  _isDragging=false;
  document.removeEventListener('mousemove',onDrag);
  document.removeEventListener('mouseup',endDrag);
  document.removeEventListener('touchmove',onDrag);
  document.removeEventListener('touchend',endDrag);
}

_tableWrap.addEventListener('scroll',syncFloatScroll);
window.addEventListener('resize',syncFloatScroll);

/* Click on track to jump */
_floatTrack.addEventListener('click',function(e){
  if(e.target===_floatThumb)return;
  var trackRect=_floatTrack.getBoundingClientRect();
  var clickX=e.clientX-trackRect.left;
  var thumbW=parseFloat(_floatThumb.style.width)||30;
  var table=document.getElementById('rentalTable');
  var sw=table.scrollWidth;
  var cw=_tableWrap.clientWidth;
  var thumbMax=cw-thumbW;
  var scrollRatio=Math.max(0,Math.min(1,(clickX-thumbW/2)/thumbMax));
  _tableWrap.scrollLeft=(sw-cw)*scrollRatio;
});

/* ===== Sort by clicking column headers ===== */
document.querySelectorAll('th.col-sort').forEach(function(th){
  th.addEventListener('click',function(){
    var field=th.dataset.sort;
    var sortSelect=document.getElementById('sortFilter');

    }else{
      newSort=field+'_desc';
    }
    sortSelect.value=newSort;
    renderTable();
  });
});
